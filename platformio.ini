[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    dlloydev/Toggle
    adafruit/Adafruit AHTX0
    adafruit/Adafruit GFX Library
    adafruit/Adafruit SSD1306
    adafruit/Adafruit GC9A01A
    tobiasschuerg/ESP8266 Influxdb

[env:esp8266dev]
platform = espressif8266
board = esp12e
framework = arduino
monitor_speed = 115200
lib_deps =
    dlloydev/Toggle
    adafruit/Adafruit AHTX0
    adafruit/Adafruit GFX Library
    adafruit/Adafruit SSD1306
    adafruit/Adafruit GC9A01A
    tobiasschuerg/ESP8266 Influxdb